<section class="prove" aria-labelledby="titolo-prove">
  <h2 id="titolo-prove">🎁 Easter egg</h2>
  <p class="prove__nota">Solo per gli admin: tocca per provarli. Sotto c'è come si trovano davvero.</p>
  <ul class="prove__elenco">
    @for (p of prove; track p.nome) {
      <li>
        <button type="button" class="prova" (click)="prova(p)">
          <strong>{{ p.titolo }}</strong>
          <small>{{ p.come }}</small>
        </button>
      </li>
    }
  </ul>
</section>
