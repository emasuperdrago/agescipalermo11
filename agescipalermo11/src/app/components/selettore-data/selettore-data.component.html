<div class="selettore-data">
  <!-- Il giorno non è una tendina: 31 righe una sotto l'altra erano troppo lunghe. Si apre
       una griglia compatta sotto i tre campi, sette giorni per riga. -->
  <button type="button" class="campo-giorno" [class.vuoto]="!giorno" [class.aperto]="giorniAperti"
          (click)="giorniAperti = !giorniAperti" aria-label="Giorno" [attr.aria-expanded]="giorniAperti">
    {{ giorno || 'Giorno' }}
  </button>
  <select name="mese" [(ngModel)]="mese" (ngModelChange)="cambia()" aria-label="Mese">
    <option value="">Mese</option>
    @for (m of mesi; track m; let i = $index) {
      <option [value]="i + 1">{{ m }}</option>
    }
  </select>
  <select name="anno" [(ngModel)]="anno" (ngModelChange)="cambia()" aria-label="Anno">
    <option value="">Anno</option>
    @for (a of anni; track a) {
      <option [value]="a">{{ a }}</option>
    }
  </select>
  @if (giorniAperti) {
    <div class="griglia-giorni" role="listbox" aria-label="Scegli il giorno">
      @for (g of giorniDelMese; track g) {
        <button type="button" role="option" [class.scelto]="giorno === '' + g"
                [attr.aria-selected]="giorno === '' + g" (click)="scegliGiorno(g)">{{ g }}</button>
      }
    </div>
  }
</div>
